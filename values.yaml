# Global configuration
global:
  # External URL/IP for client-side access (dashboard)
  # This should be set to your cluster's external IP or domain
  externalUrl: ""  # Required: e.g., "https://api.example.com" or "http://1.2.3.4"
  
  # Image pull secrets for private registries
  imagePullSecrets: []
  
  # Storage class for persistent volumes
  storageClass: ""  # Leave empty for default storage class

# Qdrant Vector Database
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334
  
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /qdrant/storage
    # storageClass: "" # Inherits from global.storageClass if not set
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Qdrant initialization job
  init:
    enabled: true
    image:
      repository: ghcr.io/kolosalai/qdrant-init
      tag: v0.0.1

# MarkItDown Service
markitdown:
  enabled: true
  image:
    repository: ghcr.io/kolosalai/markitdown-api
    tag: v0.0.1
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8081
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

# Docling Service
docling:
  enabled: true
  image:
    repository: quay.io/docling-project/docling-serve-cpu
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5001
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

# Kolosal Server (AI Inference Engine)
kolosalServer:
  enabled: true
  image:
    repository: ghcr.io/kolosalai/kolosal-server
    tag: v0.0.1
    pullPolicy: IfNotPresent
  
  service:
    type: LoadBalancer  # Or NodePort for external access
    port: 8080
    nodePort: 30084  # Only used if type is NodePort
  
  persistence:
    models:
      enabled: true
      size: 50Gi
      mountPath: /app/models
      # storageClass: "" # Inherits from global.storageClass if not set
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    metrics:
      - type: Resource
        resource:
          name: gpu
          target:
            type: Utilization
            averageUtilization: 80
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
  
  resources:
    requests:
      cpu: 2
      memory: 8Gi
      nvidia.com/gpu: 1
    limits:
      cpu: 4
      memory: 16Gi
      nvidia.com/gpu: 1
  
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu
            operator: Exists
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  
  # Kolosal server configuration
  config:
    server:
      port: "8084"
      host: "0.0.0.0"
      idle_timeout: 300
      allow_public_access: true
      allow_internet_access: true
    
    logging:
      level: INFO
      file: ""
      access_log: false
      quiet_mode: false
      show_request_details: false
    
    auth:
      enabled: true
      require_api_key: true
      api_key_header: X-API-Key
      # API keys will be stored in secrets
      rate_limit:
        enabled: true
        max_requests: 100
        window_size: 60
      cors:
        enabled: true
        allow_credentials: false
        max_age: 86400
        allowed_origins: ["*"]
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH]
        allowed_headers: [Content-Type, Authorization, X-Requested-With, Accept, Origin]
    
    search:
      enabled: false
    
    database:
      qdrant:
        enabled: true
        # host and port will be automatically set based on service discovery
        collection_name: "documents"
        default_embedding_model: "qwen3-embedding-4b"
        timeout: 30
        api_key: ""
        max_connections: 10
        connection_timeout: 5
    
    inference_engines:
      - name: llama-gpu
        library_path: /usr/local/lib/libllama-cuda.so
        version: 1.0.0
        description: CUDA-accelerated inference engine
        load_on_startup: true
      - name: llama-cpu
        library_path: /usr/local/lib/libllama-cpu.so
        version: 1.0.0
        description: CPU fallback (optional)
        load_on_startup: false
    
    default_inference_engine: llama-gpu
    
    features:
      health_check: true
      metrics: true
    
    embedding_autoscaling:
      enabled: true
      min_instances: 1
      max_instances: 4
      scale_up_threshold: 10
      scale_down_threshold: 2
      scale_up_delay: 30
      scale_down_delay: 300
      check_interval: 15
    
    models:
      - id: qwen3-embedding-4b
        path: https://huggingface.co/kolosal/qwen3-embedding-4b/resolve/main/Qwen3-Embedding-4B-Q4_K_M.gguf
        type: embedding
        load_immediately: true
        main_gpu_id: 0
        inference_engine: llama-vulkan
        load_params:
          n_ctx: 4096
          n_keep: 1024
          use_mmap: true
          use_mlock: false
          n_parallel: 1
          cont_batching: true
          warmup: false
          n_gpu_layers: 100
          n_batch: 2048
          n_ubatch: 512

# Dashboard Service
dashboard:
  enabled: true
  image:
    repository: ghcr.io/kolosalai/dashboard
    tag: v0.0.1
    pullPolicy: IfNotPresent
  
  service:
    type: LoadBalancer  # Or NodePort for external access
    port: 3000
    nodePort: 30300  # Only used if type is NodePort
  
  replicaCount: 2  # For HA
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

# Security settings
secrets:
  # API keys for kolosal-server auth
  apiKeys:
    - name: default-api-key
      value: ""  # Generate a secure key
  
  # Qdrant API key (if needed)
  qdrantApiKey: ""

# Service mesh / monitoring annotations
serviceAnnotations: {}

# Pod annotations
podAnnotations: {}

# Health check configuration
healthCheck:
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Network policies (disabled by default as requested)
networkPolicy:
  enabled: false