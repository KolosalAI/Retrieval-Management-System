{{- if and .Values.markitdown.enabled .Values.markitdown.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kolosal-platform.fullname" . }}-markitdown
  labels:
    {{- include "kolosal-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: markitdown
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kolosal-platform.fullname" . }}-markitdown
  minReplicas: {{ .Values.markitdown.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.markitdown.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.markitdown.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.markitdown.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.markitdown.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.markitdown.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}