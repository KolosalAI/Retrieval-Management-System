{{- if .Values.docling.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kolosal-platform.docling.serviceName" . }}
  labels:
    {{- include "kolosal-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: docling
  {{- with .Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.docling.service.type }}
  ports:
    - port: {{ .Values.docling.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kolosal-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: docling
{{- end }}