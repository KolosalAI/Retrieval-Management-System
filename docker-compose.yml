services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - kolosal-network

  # Qdrant Initialization Service
  qdrant-init:
    image: ghcr.io/kolosalai/qdrant-init:v0.0.1
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
    networks:
      - kolosal-network
    restart: "no"

  # MarkItDown Service
  markitdown:
    image: ghcr.io/kolosalai/markitdown-api:v0.0.1
    ports:
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - kolosal-network

  # Docling Service
  docling:
    image: quay.io/docling-project/docling-serve-cpu
    ports:
      - "8082:5001"
    restart: unless-stopped
    networks:
      - kolosal-network

  # Kolosal Server (AI Inference Engine)
  kolosal-server:
    image: ghcr.io/kolosalai/kolosal-server:v0.0.1
    ports:
      - "8084:8080"
    volumes:
      - ./models:/app/models
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - kolosal-network

  # Dashboard Service
  dashboard:
    image: ghcr.io/kolosalai/dashboard:v0.0.1
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_BASE_URL=http://kolosal-server:8084
      - DOCLING_BASE_URL=http://docling:5001
      - MARKITDOWN_BASE_URL=http://markitdown:8081
    depends_on:
      - qdrant
      - markitdown
      - kolosal-server
    restart: unless-stopped
    networks:
      - kolosal-network

volumes:
  qdrant_storage:

networks:
  kolosal-network:
    driver: bridge