{{- if .Values.markitdown.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kolosal-platform.fullname" . }}-markitdown
  labels:
    {{- include "kolosal-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: markitdown
spec:
  {{- if not .Values.markitdown.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "kolosal-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: markitdown
  template:
    metadata:
      labels:
        {{- include "kolosal-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: markitdown
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.markitdown.securityContext | nindent 8 }}
      containers:
        - name: markitdown
          image: "{{ .Values.markitdown.image.repository }}:{{ .Values.markitdown.image.tag }}"
          imagePullPolicy: {{ .Values.markitdown.image.pullPolicy }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.markitdown.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.healthCheck.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.healthCheck.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.markitdown.resources | nindent 12 }}
{{- end }}