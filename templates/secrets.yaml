apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kolosal-platform.apiKeysSecretName" . }}
  labels:
    {{- include "kolosal-platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.kolosalServer.config.auth.require_api_key }}
  {{- range $index, $apiKey := .Values.secrets.apiKeys }}
  {{- if $apiKey.value }}
  api-key-{{ $index }}: {{ $apiKey.value | b64enc }}
  {{- else }}
  api-key-{{ $index }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.qdrantApiKey }}
  qdrant-api-key: {{ .Values.secrets.qdrantApiKey | b64enc }}
  {{- end }}