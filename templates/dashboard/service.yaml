{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kolosal-platform.dashboard.serviceName" . }}
  labels:
    {{- include "kolosal-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.dashboard.service.type "NodePort") .Values.dashboard.service.nodePort }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kolosal-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}