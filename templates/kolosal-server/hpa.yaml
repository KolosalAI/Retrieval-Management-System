{{- if and .Values.kolosalServer.enabled .Values.kolosalServer.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kolosal-platform.fullname" . }}-kolosal-server
  labels:
    {{- include "kolosal-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: kolosal-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kolosal-platform.fullname" . }}-kolosal-server
  minReplicas: {{ .Values.kolosalServer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.kolosalServer.autoscaling.maxReplicas }}
  metrics:
    {{- toYaml .Values.kolosalServer.autoscaling.metrics | nindent 4 }}
{{- end }}